<!DOCTYPE html>
<html>
<!-- 2026-11-13: GitHub Pages version of the HMS_UserStudy SurveyJS page. Answers (0 = left, 1 = right, as HMS views.submit stores
     them) are POSTed to the Google Apps Script web app in config.js (SHEET_URL), one row per participant. -->
<head>
    <title>Motion User Study</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link href="https://unpkg.com/survey-jquery@1.11.14/defaultV2.min.css" type="text/css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/survey-jquery@1.11.14/survey.jquery.min.js"></script>
    <script src="config.js"></script>
    <style>
        body { margin: 0; background: #f3f3f3 }
        .sd-body.sd-body--static { max-width: 90% !important; }
        .sd-description { font-style: italic; font-size: larger; color: var(--foreground-light, #909090); }
        .prompt { font-size: 1.15rem; margin: 0 0 10px }
        video { background: #fff; border-radius: 4px }
        /* 2026-11-13 (user: video + questions on one screen, no scrolling): the video takes what is left of the viewport after
           the prompt, the 3 questions (one row each, compact) and the navigation; SurveyJS padding tightened */
        .sd-root-modern video { display: block; margin: 0 auto; width: auto !important; max-width: 100%; height: calc(100vh - 500px); min-height: 180px }
        .prompt { font-size: 1rem; margin: 0 0 6px }
        .hint { font-size: 0.85rem; color: #777; margin: 4px 0 0; text-align: center }
        .sd-body.sd-body--static { padding-top: 8px !important; padding-bottom: 8px !important }
        .sd-page { padding-top: 0 !important; padding-bottom: 0 !important }
        .sd-row { margin-top: 8px !important }
        .sd-element--with-frame { padding: 6px 14px 8px !important }
        .sd-question--rating .sd-question__content { padding-top: 0 !important }
        .sd-question__header { padding-bottom: 4px !important }
        .sd-title.sd-element__title { font-size: 0.92rem !important; line-height: 1.3 !important }
        .sd-rating__item { min-width: 40px; padding: 2px 12px !important; min-height: 0 !important }
        .sd-rating__item-text.sd-rating__min-text, .sd-rating__item-text.sd-rating__max-text { font-size: 0.8rem }
        .sd-container-modern__title { padding: 12px 0 !important }
        .sd-title.sd-container-modern__title h3 { font-size: 1.3rem !important }
        .sd-progress { margin-top: 0 !important }
        .sd-body__navigation { padding-top: 8px !important }
        #done { max-width: 900px; margin: 24px auto; font: 15px/1.5 system-ui, sans-serif; display: none }
    </style>
</head>
<body>
    <div id="surveyContainer"></div>
    <div id="done"><p id="msg"></p><a id="dl" download="answers.json" style="display:none">Download your answers</a></div>
    <script>
    $(function () {
        $.getJSON("form.json?" + Date.now(), function (data) {
            // 2026-11-13: part 1 = the 20 rating clips of ONE balanced set (studySets, drawn at random per participant), part 2 = the
            // 20 pairwise items; each part shuffled per participant, intro pages stay in place
            function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
            var set = Math.floor(Math.random() * 5);
            var by = function (b) { return data.pages.filter(function (p) { return p.block === b; }); };
            var unary = shuffle(by('unary').filter(function (p) { return p.studySets.indexOf(set) >= 0; }));
            data.pages = by('intro').concat(by('part1'), unary, by('part2'), shuffle(by('pair')));
            data.pages.forEach(function (p) { delete p.block; delete p.studySets; });
            var survey = new Survey.Model(data), t0 = Date.now();
            survey.onComplete.add(function (sender) {
                var items = {};
                Object.keys(sender.data).forEach(function (k) { items[k] = k === 'participant__initials' ? String(sender.data[k]).trim().toUpperCase() : parseInt(sender.data[k]) - 1; });
                items.participant__set = set;
                var rec = { submitted: new Date().toISOString(), seconds: Math.round((Date.now() - t0) / 1000), answers: items };
                var s = JSON.stringify(rec);
                $("#dl").attr("href", "data:application/json," + encodeURIComponent(s));
                $("#done").show();
                if (!window.SHEET_URL) { $("#msg").text("Thank you! Please download your answers and send them to the organizer."); $("#dl").show(); return; }
                // text/plain + no-cors: no CORS preflight, which Apps Script web apps do not answer
                fetch(window.SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: s })
                    .then(function () { $("#msg").text("Thank you! Your answers were submitted."); })
                    .catch(function () { $("#msg").text("Submission failed. Please download your answers and send them to the organizer."); $("#dl").show(); });
            });
            $("#surveyContainer").Survey({ model: survey });
        });
    });
    </script>
</body>
</html>
